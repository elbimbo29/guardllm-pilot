version: "3.8"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: guardllm-timescaledb
    restart: always
    environment:
      POSTGRES_DB: guardllm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guardllm"]
      interval: 5s
      timeout: 5s
      retries: 5

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardllm-proxy
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=guardllm
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
    depends_on:
      timescaledb:
        condition: service_healthy

grafana:
  image: grafana/grafana:latest
  container_name: guardllm-grafana
  ports:
    - "3000:3000"
  environment:
    - GF_SECURITY_ADMIN_USER=admin
    - GF_SECURITY_ADMIN_PASSWORD=admin
  volumes:
    - grafana_data:/var/lib/grafana
    - ./grafana/provisioning:/etc/grafana/provisioning
  depends_on:
    - guardllm-timescaledb
  restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: guardllm-streamlit
    restart: always
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=guardllm
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  timescaledb_data:
  grafana_data: